name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App and Sync Android
        run: |
          npm run build
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.ironlog.app","appName":"IronLog","webDir":"dist"}' > capacitor.config.json
          fi
          if [ ! -d "android" ]; then
            echo "Android directory not found in repository. Initializing Capacitor Android..."
            npx cap add android
          fi
          npx cap sync android
          if ! grep -q "android.permission.VIBRATE" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' android/app/src/main/AndroidManifest.xml
          fi

      - name: Fix gradlew permissions and line endings
        run: |
          sed -i -e 's/\r$//' android/gradlew || true
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/IronLog-debug.apk
          echo "APK generated at release-artifacts/IronLog-debug.apk"
          ls -lh release-artifacts/IronLog-debug.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IronLog-debug-apk
          path: release-artifacts/IronLog-debug.apk
          retention-days: 30

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "IronLog Release ${{ steps.vars.outputs.tag }}"
          body: |
            ### IronLog 모바일 APK 배포판
            - **빌드 번호**: `${{ github.run_number }}`
            - **커밋**: `${{ github.sha }}`
            - **안내**: 아래 첨부된 `IronLog-debug.apk` 파일을 다운로드하여 안드로이드 기기에 설치하세요.
          files: release-artifacts/IronLog-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
